<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Roll Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Piano Roll</h1>
    <label>Song <select id="songSel"></select></label>
  </header>
  <audio id="audio" controls preload="auto"></audio>
  <div id="stems" hidden></div>
  <div id="timerBar" hidden>
    <button id="timerBtn">Play (timer)</button>
    <span>No audio for this song; playhead runs on a timer.</span>
  </div>
  <div class="toolbar">
    <button id="zoomOut" title="Zoom out">&minus;</button>
    <span id="zoomLbl"></span>
    <button id="zoomIn" title="Zoom in">+</button>
    <label><input type="checkbox" id="specChk" checked> Spectrogram (vocals)</label>
    <span id="specStatus" class="hint"></span>
    <label><input type="checkbox" id="lyricChk" checked> Text</label>
    <label><input type="checkbox" id="sheetChk" checked> Noten</label>
    <label><input type="checkbox" id="editChk"> Edit notes</label>
    <span class="hint">Space: play/pause &middot; click roll: seek</span>
  </div>
  <div id="editTools" class="toolbar" hidden>
    <button id="selAll">Select all</button>
    <button id="selNone">Clear</button>
    <select id="roleSel"></select>
    <button id="roleBtn">Rolle setzen</button>
    <button id="phraseBtn">Phrasenanfang</button>
    <button id="saveBtn" disabled>Save</button>
    <button id="reloadBtn">Reload</button>
    <span class="hint">Click/drag box: select (Shift adds) &middot; drag note: move group &middot; drag note edge: resize &middot; &larr;/&rarr;: 10 ms (Shift: 100 ms, Ctrl: start only, Alt: end only)</span>
  </div>
  <div id="legend" hidden></div>
  <div id="wrap"><canvas id="roll"></canvas></div>
  <div id="sheet" hidden></div>
  <div id="readout">
    <span>Time <b id="rTime">0.00</b> s</span>
    <span>Pitch <b id="rPitch">–</b></span>
    <span>Note <b id="rNote">–</b></span>
    <span>Selected <b id="rSel">0</b></span>
  </div>
  <div id="status"></div>
</main>
<script src="vendor/opensheetmusicdisplay.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
