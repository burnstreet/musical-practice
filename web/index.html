<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Roll Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Piano Roll</h1>
    <label>Song <select id="songSel"></select></label>
  </header>
  <audio id="audio" controls preload="auto"></audio>
  <div id="stems" hidden></div>
  <div class="toolbar">
    <button id="zoomOut" title="Weniger Takte / Sekunden">&minus;</button>
    <span id="zoomLbl"></span>
    <button id="zoomIn" title="Mehr Takte / Sekunden">+</button>
    <label><input type="checkbox" id="specChk" checked> Spectrogram (vocals)</label>
    <span id="specStatus" class="hint"></span>
    <label><input type="checkbox" id="lyricChk" checked> Text</label>
    <label><input type="checkbox" id="editChk"> Edit notes</label>
    <span class="hint">Space: play/pause &middot; click roll: seek</span>
  </div>
  <div id="editTools" class="toolbar" hidden>
    <button id="selAll">Select all</button>
    <button id="selNone">Clear</button>
    <button id="saveBtn" disabled>Save</button>
    <button id="reloadBtn">Reload</button>
    <span class="hint">Click/drag box: select (Shift adds) &middot; drag note: move group &middot; drag note edge: resize &middot; &larr;/&rarr;: 10 ms (Shift: 100 ms, Ctrl: start only, Alt: end only)</span>
  </div>
  <div id="legend" hidden></div>
  <div id="editor">
    <div id="editorMain">
      <section id="view" hidden>
        <div class="viewbar">
          <span class="cap">Noten · Phrasen · Abschnitte</span>
          <button id="pagePrev" aria-label="Vorige Takte">&lsaquo;</button>
          <b id="pageLbl"></b>
          <button id="pageNext" aria-label="Nächste Takte">&rsaquo;</button>
        </div>
        <canvas id="staffCv"></canvas>
        <canvas id="bandCv"></canvas>
      </section>
      <p id="viewHint" class="hint" hidden></p>
      <div id="wrap"><canvas id="roll"></canvas></div>
    </div>
    <aside id="editorSide">
      <section id="noteCard" class="panel" hidden>
        <div class="cap">Ausgewählte Note</div>
        <div class="noteMain"><span id="noteBig"></span><span id="noteInfo"></span></div>
        <div id="noteMeta"></div>
        <div id="noteEdit" hidden>
          <select id="roleSel"></select>
          <button id="roleBtn" class="primary">Rolle setzen</button>
          <button id="phraseBtn" aria-pressed="false">Phrasenanfang</button>
        </div>
      </section>
      <section id="sectPanel" class="panel" hidden>
        <div class="cap">Abschnitte</div>
        <span id="sectState"></span>
        <div id="sectList"></div>
        <button id="sectBtn">Abschnitte neu erkennen</button>
      </section>
    </aside>
  </div>
  <div id="readout">
    <span>Time <b id="rTime">0.00</b> s</span>
    <span>Pitch <b id="rPitch">–</b></span>
    <span>Note <b id="rNote">–</b></span>
    <span>Selected <b id="rSel">0</b></span>
  </div>
  <div id="status"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
