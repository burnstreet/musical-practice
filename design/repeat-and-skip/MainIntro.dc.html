<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Singen Intro überspringen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1F5FAB;color:#FFFFFF;font-family:'DM Sans',system-ui,sans-serif;padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px">

<header style="display:flex;align-items:center;gap:12px">
<a href="#" aria-label="Zurück zur Auswahl" style="width:44px;height:44px;border-radius:22px;background:#17498C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div><div style="font-family:'Fraunces',serif;font-size:19px;font-weight:600">Lied 3 · [Liedtitel]</div><div style="font-size:12px;color:#CFE0F5;margin-top:1px">Takt 1–2 · C-Dur · 72 BPM</div></div>
</header>

<button aria-label="Voicetrack-Modus ändern: nur für andere" style="height:40px;border-radius:12px;background:#17498C;border:0;color:#FFFFFF;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:14px"><span style="color:#CFE0F5">Voicetrack</span><span style="display:flex;align-items:center;gap:8px;font-weight:700">nur für andere<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></button>

<div style="background:#17498C;border-radius:20px;padding:8px 12px">
<svg viewBox="0 0 334 112" width="100%" role="img" aria-label="Notenzeile, Takt 1 und 2 sind der Instrumental-Intro: zwei Ganztaktpausen." style="display:block;height:auto">
<g stroke="#CFE0F5" stroke-width="1.1" stroke-opacity="0.7"><line x1="2" y1="30" x2="332" y2="30"/><line x1="2" y1="38" x2="332" y2="38"/><line x1="2" y1="46" x2="332" y2="46"/><line x1="2" y1="54" x2="332" y2="54"/><line x1="2" y1="62" x2="332" y2="62"/>
<line x1="170" y1="30" x2="170" y2="62"/><line x1="332" y1="30" x2="332" y2="62"/></g>
<text x="4" y="64" font-size="42" fill="#CFE0F5" font-family="Noto Music, Segoe UI Symbol, Apple Symbols, serif" aria-hidden="true">𝄞</text>
<g font-family="DM Sans, sans-serif" font-size="10" fill="#CFE0F5"><text x="36" y="22">1 · Intro</text><text x="174" y="22">2 · Intro</text></g>
<g fill="#CFE0F5" fill-opacity="0.6"><rect x="98" y="38" width="14" height="5" rx="1"/><rect x="246" y="38" width="14" height="5" rx="1"/></g>
<line x1="38" y1="8" x2="38" y2="106" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 4"/>
</svg>
</div>

<div style="background:#17498C;border-radius:20px;padding:8px 12px">
<svg viewBox="0 0 334 170" width="100%" role="img" aria-label="Tonhöhenverlauf: noch keine Töne im Fenster, rechts erscheinen die ersten Noten von Josef (andere Stimme) und danach Marias." style="display:block;height:auto">
<g stroke="#3F78BF" stroke-width="1"><line x1="0" y1="0" x2="334" y2="0"/><line x1="0" y1="34" x2="334" y2="34"/><line x1="0" y1="68" x2="334" y2="68"/><line x1="0" y1="102" x2="334" y2="102"/><line x1="0" y1="136" x2="334" y2="136"/></g>
<rect x="228" y="94" width="60" height="22" rx="8" fill="#A9D3F7" fill-opacity="0.12" stroke="#A9D3F7" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="298" y="60" width="36" height="22" rx="8" fill="{{accent}}" fill-opacity="0.18" stroke="{{accent}}" stroke-width="2" stroke-opacity="0.7"/>
<line x1="100" y1="0" x2="100" y2="146" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 4"/>
<g font-family="DM Sans, sans-serif" font-size="12" text-anchor="middle"><text x="258" y="164" fill="#A9D3F7">Der</text><text x="316" y="164" fill="{{accent}}">weis</text></g>
</svg>
</div>

<div style="background:#17498C;border-radius:20px;padding:10px 16px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-family:'Fraunces',serif;font-size:32px;font-weight:600;line-height:1">–</span></div>
<div style="font-size:15px;font-weight:700">Einsatz in 2 Takten · 5 s</div>
</div>
<div style="position:relative;height:8px;border-radius:4px;background:#3F78BF;margin:0 2px">
<div style="position:absolute;left:35%;width:30%;top:0;bottom:0;background:{{accent}};opacity:0.5;border-radius:4px"></div>
<div style="position:absolute;left:50%;top:-3px;width:2px;height:14px;background:#FFFFFF;margin-left:-1px"></div>
</div>
</div>

<div style="background:#17498C;border-radius:20px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#CFE0F5;padding:0 4px">
<span>0:04 / 2:15</span><span>Loop aus</span>
</div>
<svg viewBox="0 0 334 40" width="100%" role="img" aria-label="Verlauf des Liedes mit Abschnitten Strophe 1, Refrain, Strophe 2, Refrain 2. Position 0:04, noch im Intro." style="display:block;height:auto">
<g font-family="DM Sans, sans-serif" font-size="11" fill="#CFE0F5">
<text x="34" y="10">Strophe 1</text><text x="113" y="10">Refrain</text><text x="175" y="10">Strophe 2</text><text x="249" y="10">Refrain 2</text>
</g>
<g fill="#3F78BF">
<rect x="0" y="18" width="30" height="12" rx="3" fill-opacity="0.35"/>
<rect x="32" y="18" width="77" height="12" rx="3"/>
<rect x="111" y="18" width="62" height="12" rx="3"/>
<rect x="175" y="18" width="70" height="12" rx="3"/>
<rect x="247" y="18" width="73" height="12" rx="3"/>
<rect x="322" y="18" width="12" height="12" rx="3" fill-opacity="0.35"/>
</g>
<circle cx="10" cy="24" r="9" fill="#FFFFFF" stroke="#17498C" stroke-width="3"/>
</svg>
</div>

<div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#CFE0F5;padding-left:6px;margin-bottom:-2px">Wiederholen</div>
<div role="group" aria-label="Loop-Auswahl" style="display:flex;gap:6px">
<button aria-pressed="true" style="flex:1;height:44px;border-radius:22px;background:{{accent}};border:0;color:#0F2F57;font-size:13px;font-weight:700">Aus</button>
<button style="flex:1;height:44px;border-radius:22px;background:#17498C;border:0;color:#FFFFFF;font-size:13px;font-weight:500">Phrase</button>
<button style="flex:1.4;height:44px;border-radius:22px;background:#17498C;border:0;color:#FFFFFF;font-size:13px;font-weight:500">Abschnitt</button>
<button style="flex:1.2;height:44px;border-radius:22px;background:#17498C;border:0;color:#FFFFFF;font-size:13px;font-weight:500">Einsatz</button>
<button style="flex:1;height:44px;border-radius:22px;background:#17498C;border:0;color:#FFFFFF;font-size:13px;font-weight:500">A–B</button>
</div>

<div style="display:flex;gap:8px">
<button aria-label="Zum vorigen eigenen Einsatz springen (nicht möglich)" disabled style="width:44px;height:44px;border-radius:12px;background:#17498C;border:0;display:flex;align-items:center;justify-content:center;opacity:0.4;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v14L9 12z"/><path d="M5 5v14" stroke-linecap="round"/></svg></button>
<button aria-label="Intro überspringen" style="flex:1.4;height:44px;border-radius:12px;background:{{accent}};border:0;color:#0F2F57;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700">Intro überspringen<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F2F57" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button>
<button aria-label="Zum nächsten eigenen Einsatz springen" style="flex:1;height:44px;border-radius:12px;background:#17498C;border:0;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500">Mein Einsatz<svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 5v14l10-7z"/><path d="M19 5v14" stroke-linecap="round"/></svg></button>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0">
<button aria-label="Zurück zum Anfang der Phrase" style="width:52px;height:52px;border-radius:26px;background:#17498C;border:0;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v14L9 12z"/><path d="M5 5v14" stroke-linecap="round"/></svg>
</button>
<button aria-label="Pause" style="width:68px;height:68px;border-radius:34px;background:{{accent}};border:0;display:flex;align-items:center;justify-content:center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="#0F2F57" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
</button>
<button aria-label="Tempo 100 Prozent" style="width:52px;height:52px;border-radius:26px;background:#17498C;border:0;color:#FFFFFF;font-size:13px;font-weight:700">100%</button>
<button aria-label="Mikrofon aktiv" style="width:52px;height:52px;border-radius:26px;background:#17498C;border:0;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8E05A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8E05A","options":["#C8E05A","#8FD16A","#FFD166","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C8E05A' };
}
}
</script>
</body>
</html>
