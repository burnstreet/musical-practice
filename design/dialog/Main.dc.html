<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Text üben: Auswahl</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:1000px;box-sizing:border-box;background:#1F5FAB;color:#FFFFFF;font-family:'DM Sans',system-ui,sans-serif;padding:24px 20px 28px;display:flex;flex-direction:column;gap:14px;overflow:hidden">

<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<div style="font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#C8E05A">[Produktionstitel]</div>
<a href="Settings.dc.html" aria-label="Einstellungen" style="width:44px;height:44px;border-radius:22px;background:#17498C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</a>
</div>

<div style="background:#17498C;border-radius:16px;display:flex;flex-direction:column">
<button aria-expanded="{{open}}" onClick="{{toggle}}" style="display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border:0;background:transparent;color:#FFFFFF;text-align:left;width:100%">
<span style="flex:1;min-width:0"><span style="display:block;font-size:12px;color:#CFE0F5">Deine Rollen · für Lieder und Text</span><span style="display:block;font-size:16px;font-weight:700;margin-top:2px">{{picked}}</span></span>
<span style="font-size:13px;font-weight:700;color:#C8E05A">{{toggleLabel}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8E05A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{chevron}}"/></svg>
</button>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="13">
<sc-if value="{{r.on}}" hint-placeholder-val="{{false}}">
<button aria-pressed="true" onClick="{{r.flip}}" style="height:44px;padding:0 14px 0 10px;border-radius:22px;border:2px solid #C8E05A;background:#C8E05A;color:#0F2F57;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F2F57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>{{r.name}}</button>
</sc-if>
<sc-if value="{{r.off}}" hint-placeholder-val="{{true}}">
<button aria-pressed="false" onClick="{{r.flip}}" style="height:44px;padding:0 14px;border-radius:22px;border:2px solid #A9D3F7;background:transparent;color:#FFFFFF;font-size:14px;font-weight:500">{{r.name}}</button>
</sc-if>
</sc-for>
</div>
</sc-if>
</div>

<div role="tablist" aria-label="Was üben" style="display:flex;background:#17498C;border-radius:22px;padding:4px;gap:4px">
<button role="tab" aria-selected="false" style="flex:1;height:40px;border-radius:18px;border:0;background:transparent;color:#CFE0F5;font-size:15px;font-weight:500">Lieder</button>
<button role="tab" aria-selected="true" style="flex:1;height:40px;border-radius:18px;border:0;background:#C8E05A;color:#0F2F57;font-size:15px;font-weight:700">Text</button>
</div>

<a href="Play.dc.html" style="display:flex;align-items:center;gap:14px;background:#C8E05A;color:#0F2F57;border-radius:16px;padding:10px 14px;min-height:60px;box-sizing:border-box">
<span style="width:40px;height:40px;border-radius:20px;background:#0F2F57;display:flex;align-items:center;justify-content:center;flex:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="#C8E05A" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:700">Weiter bei Szene 4</span><span style="display:block;font-size:12px;margin-top:2px">Zuletzt geübt: gestern</span></span>
</a>

<div style="display:flex;align-items:baseline;justify-content:space-between">
<div style="font-family:'Fraunces',serif;font-size:22px;font-weight:600">Szene wählen</div>
<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#CFE0F5"><span style="width:8px;height:8px;border-radius:4px;background:#C8E05A;display:inline-block"></span>deine Zeilen</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{scenes}}" as="s" hint-placeholder-count="8">
<a href="Play.dc.html" style="display:flex;align-items:center;gap:14px;background:#17498C;border-radius:16px;padding:10px 14px;min-height:60px;box-sizing:border-box">
<span style="width:36px;height:36px;border-radius:18px;background:#1F5FAB;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none">{{s.n}}</span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:700">[Szenentitel]</span><span style="display:block;font-size:12px;color:#CFE0F5;margin-top:2px">{{s.meta}}</span></span>
<span style="font-size:13px;font-weight:700;color:#C8E05A;flex:none">{{s.mine}}</span>
</a>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["Rolle gewählt","erster Start"],"default":"Rolle gewählt"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: false, picked: null };
}
renderVals() {
const names = ['Lena', 'Vater', 'Clara', 'Tom', 'Frau Berger', 'Max', 'Schaffner', 'Kioskfrau', 'Polizist', 'Straßenmusiker', 'Erzähler', 'Erzählerin', 'Chor'];
const picked = this.state.picked ?? ((this.props.start ?? 'Rolle gewählt') === 'erster Start' ? [] : ['Lena']);
const roles = names.map((name) => ({
  name, on: picked.includes(name), off: !picked.includes(name),
  flip: () => this.setState({ picked: picked.includes(name) ? picked.filter((p) => p !== name) : [...picked, name] }),
}));
const scenes = [
  { n: 1, meta: '2 Rollen · 1 Lied', mine: '3 Zeilen' },
  { n: 2, meta: '3 Rollen · 1 Lied', mine: '8 Zeilen' },
  { n: 3, meta: '5 Rollen · 2 Lieder', mine: '12 Zeilen' },
  { n: 4, meta: '6 Rollen · 1 Lied', mine: '14 Zeilen' },
  { n: 5, meta: '6 Rollen · 1 Lied', mine: '9 Zeilen' },
  { n: 6, meta: '7 Rollen · 2 Lieder', mine: '11 Zeilen' },
  { n: 7, meta: '5 Rollen · 1 Lied', mine: '7 Zeilen' },
  { n: 8, meta: '8 Rollen · 1 Lied', mine: '9 Zeilen' },
];
const none = picked.length === 0;
const open = this.state.open || none;
return {
  roles, scenes, open,
  picked: none ? 'Wähle mindestens eine Rolle' : picked.join(', '),
  toggle: () => { if (!none) this.setState({ open: !open }); },
  toggleLabel: none ? '' : open ? 'fertig' : 'ändern',
  chevron: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
};
}
}
</script>
</body>
</html>
