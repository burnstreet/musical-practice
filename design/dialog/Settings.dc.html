<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Einstellungen Text</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F2F57;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden">
<div role="dialog" aria-label="Einstellungen Text" style="background:#1F5FAB;color:#FFFFFF;border-radius:24px 24px 0 0;padding:12px 20px 24px;display:flex;flex-direction:column;gap:18px;height:792px;box-sizing:border-box">
<div style="width:40px;height:5px;border-radius:3px;background:#3F78BF;align-self:center"></div>
<div style="display:flex;align-items:center;justify-content:space-between">
<h1 style="margin:0;font-family:'Fraunces',serif;font-size:24px;font-weight:600">Einstellungen Text</h1>
<a href="Play.dc.html" style="height:40px;padding:0 16px;border-radius:20px;background:#C8E05A;color:#0F2F57;font-size:14px;font-weight:700;display:flex;align-items:center">Fertig</a>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:14px;font-weight:700">Eigene Zeile</div>
<div role="group" aria-label="Eigene Zeile" style="display:flex;background:#17498C;border-radius:14px;padding:3px;gap:3px">
<button aria-pressed="false" style="flex:1;height:40px;border-radius:11px;border:0;background:transparent;color:#FFFFFF;font-size:14px">Zeigen</button>
<button aria-pressed="true" style="flex:1;height:40px;border-radius:11px;border:0;background:#C8E05A;color:#0F2F57;font-size:14px;font-weight:700">Anfang</button>
<button aria-pressed="false" style="flex:1;height:40px;border-radius:11px;border:0;background:transparent;color:#FFFFFF;font-size:14px">Verstecken</button>
</div>
<div style="font-size:12px;color:#CFE0F5">Anfang: die ersten drei Wörter, der Rest zum Aufdecken.</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><label for="silence" style="font-size:14px;font-weight:700">Pause bis weiter</label><span style="font-size:14px;font-weight:700;color:#C8E05A">1,2 s</span></div>
<input id="silence" type="range" min="0.5" max="3" step="0.1" value="1.2" style="width:100%;accent-color:#C8E05A">
<div style="display:flex;justify-content:space-between;font-size:12px;color:#CFE0F5"><span>0,5 s</span><span>So lange still, dann geht es weiter.</span><span>3 s</span></div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:14px;font-weight:700">Sprechtempo der anderen</div>
<div role="group" aria-label="Sprechtempo" style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:6px">
<button aria-pressed="false" style="height:44px;border-radius:12px;border:2px solid #3F78BF;background:transparent;color:#FFFFFF;font-size:13px">0,8×</button>
<button aria-pressed="false" style="height:44px;border-radius:12px;border:2px solid #3F78BF;background:transparent;color:#FFFFFF;font-size:13px">0,9×</button>
<button aria-pressed="true" style="height:44px;border-radius:12px;border:2px solid #C8E05A;background:#C8E05A;color:#0F2F57;font-size:13px;font-weight:700">1,0×</button>
<button aria-pressed="false" style="height:44px;border-radius:12px;border:2px solid #3F78BF;background:transparent;color:#FFFFFF;font-size:13px">1,1×</button>
<button aria-pressed="false" style="height:44px;border-radius:12px;border:2px solid #3F78BF;background:transparent;color:#FFFFFF;font-size:13px">1,2×</button>
<button aria-pressed="false" style="height:44px;border-radius:12px;border:2px solid #3F78BF;background:transparent;color:#FFFFFF;font-size:13px">1,3×</button>
</div>
</div>

<div style="display:flex;flex-direction:column;background:#17498C;border-radius:16px">
<label style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 14px;font-size:14px">Regieanweisungen anzeigen
<input type="checkbox" checked style="width:22px;height:22px;accent-color:#C8E05A"></label>
<div style="height:1px;background:#1F5FAB;margin:0 14px"></div>
<label style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 14px;font-size:14px">Szene wiederholen
<input type="checkbox" style="width:22px;height:22px;accent-color:#C8E05A"></label>
</div>

<div style="display:flex;align-items:center;gap:12px;background:#17498C;border-radius:16px;padding:12px 14px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8E05A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0118 0v2"/><rect x="3" y="14" width="4" height="7" rx="2"/><rect x="17" y="14" width="4" height="7" rx="2"/></svg>
<div style="flex:1;font-size:13px;line-height:1.45">Mit Kopfhörern üben. Sonst hört das Mikro die anderen Stimmen und geht zu früh weiter.</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;font-weight:700">Mikro testen</span><span style="font-size:12px;color:#CFE0F5">sprich etwas</span></div>
<div role="img" aria-label="Mikrofonpegel" style="height:10px;border-radius:5px;background:#3F78BF"><div style="width:48%;height:100%;border-radius:5px;background:#C8E05A"></div></div>
</div>

</div>
</div>
</x-dc>

return {};
}

</body>
</html>
