<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Durchlauf: du bist dran</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1F5FAB;color:#FFFFFF;font-family:'DM Sans',system-ui,sans-serif;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden">

<div style="display:flex;align-items:center;gap:10px">
<a href="Main.dc.html" aria-label="Zurück zur Auswahl" style="width:44px;height:44px;border-radius:22px;background:#17498C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div style="flex:1;min-width:0">
<div style="font-family:'Fraunces',serif;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Szene 4 · [Szenentitel]</div>
<div role="img" aria-label="Fortschritt in der Szene: 24 von 61" style="height:3px;border-radius:2px;background:#3F78BF;margin-top:6px"><div style="width:39%;height:100%;border-radius:2px;background:#FFFFFF"></div></div>
</div>
<a href="Settings.dc.html" aria-label="Einstellungen" style="width:44px;height:44px;border-radius:22px;background:#17498C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</a>
</div>

<div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden">

<sc-for list="{{past}}" as="p" hint-placeholder-count="5">
<sc-if value="{{p.isDir}}" hint-placeholder-val="{{false}}">
<div style="font-size:14px;font-style:italic;line-height:1.4;color:#CFE0F5;padding:0 4px;opacity:{{p.fade}}">{{p.text}}</div>
</sc-if>
<sc-if value="{{p.isLine}}" hint-placeholder-val="{{true}}">
<div style="opacity:{{p.fade}};padding:0 4px">
<div style="font-size:12px;font-weight:700;color:{{p.who}}">{{p.role}}</div>
<div style="font-size:16px;line-height:1.4;margin-top:1px">{{p.text}}</div>
</div>
</sc-if>
</sc-for>

<div style="background:#C8E05A;color:#0F2F57;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<span style="font-family:'Fraunces',serif;font-size:20px;font-weight:600">Du bist dran</span>
<sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
<span role="status" style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F2F57" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>hört zu</span>
</sc-if>
<sc-if value="{{speaking}}" hint-placeholder-val="{{false}}">
<span role="status" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700"><svg width="34" height="16" viewBox="0 0 34 16" aria-hidden="true"><g fill="#0F2F57"><rect x="0" y="6" width="4" height="4" rx="2"/><rect x="6" y="2" width="4" height="12" rx="2"/><rect x="12" y="0" width="4" height="16" rx="2"/><rect x="18" y="4" width="4" height="8" rx="2"/><rect x="24" y="1" width="4" height="14" rx="2"/><rect x="30" y="6" width="4" height="4" rx="2"/></g></svg>du sprichst</span>
</sc-if>
</div>

<sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
<sc-if value="{{l.visible}}" hint-placeholder-val="{{true}}">
<div style="font-family:'Fraunces',serif;font-size:23px;font-weight:500;line-height:1.35">{{l.text}}</div>
</sc-if>
<sc-if value="{{l.hidden}}" hint-placeholder-val="{{false}}">
<div aria-label="Zeile verdeckt" style="display:flex;flex-direction:column;gap:8px;padding:6px 0">
<div style="height:14px;border-radius:7px;background:#0F2F57;opacity:0.18;width:92%"></div>
<div style="height:14px;border-radius:7px;background:#0F2F57;opacity:0.18;width:58%"></div>
</div>
</sc-if>
</sc-for>

<div style="display:flex;gap:8px">
<sc-if value="{{canReveal}}" hint-placeholder-val="{{true}}">
<button onClick="{{reveal}}" style="flex:1;height:44px;border-radius:22px;border:2px solid #0F2F57;background:transparent;color:#0F2F57;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F2F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Aufdecken</button>
</sc-if>
<button style="flex:1;height:44px;border-radius:22px;border:2px solid #0F2F57;background:transparent;color:#0F2F57;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F2F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/></svg>Vorsprechen</button>
</div>
<div style="display:flex;align-items:center;gap:8px;font-size:12px">
<div role="img" aria-label="Mikrofonpegel" style="flex:1;height:6px;border-radius:3px;background:#B3CB45"><div style="width:{{level}};height:100%;border-radius:3px;background:#0F2F57"></div></div>
<span style="flex:none">weiter nach 1,2 s Stille</span>
</div>
</div>

</div>

<div style="display:flex;align-items:center;justify-content:space-between;flex:none">
<a href="Play.dc.html" aria-label="Zurück zum vorigen Eintrag" style="width:52px;height:52px;border-radius:26px;background:#17498C;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v14L9 12z"/><path d="M5 5v14" stroke-linecap="round"/></svg>
</a>
<a href="Cue.dc.html" style="flex:1;margin:0 12px;height:60px;border-radius:30px;background:#FFFFFF;color:#0F2F57;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px">Weiter<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F2F57" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<button aria-label="Pause" style="width:52px;height:52px;border-radius:26px;background:#17498C;border:0;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"eigeneZeile":{"editor":"enum","options":["Zeigen","Anfang","Verstecken"],"default":"Anfang"},"phase":{"editor":"enum","options":["wartet","spricht"],"default":"wartet"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { revealed: false };
}
renderVals() {
const items = [
  ['Mutter', 'Anna! Da bist du ja endlich. Ich warte schon eine halbe Ewigkeit.'],
  ['Anna', 'Ich hab den Bus verpasst. Tut mir leid! Der nächste kam erst nach zwanzig Minuten.'],
  [null, 'Mutter setzt sich auf die Bank.'],
  ['Mutter', 'Macht nichts. Komm, wir suchen zusammen noch ein Geschenk für Oma. Sie wünscht sich doch jedes Jahr etwas, das glitzert.'],
];
const n = items.length;
const past = items.map(([role, text], i) => ({
  role: role === 'Anna' ? 'Anna · du' : role, text,
  isLine: !!role, isDir: !role,
  who: role === 'Anna' ? '#C8E05A' : '#A9D3F7',
  fade: String(0.35 + 0.5 * (i + 1) / n),
}));
const texts = ['Oma mag doch Schneekugeln. Da drüben am Stand gibt es welche, mit kleinen Häusern drin!', 'Darf ich eine aussuchen?'];
const setting = { Zeigen: 'show', Anfang: 'start', Verstecken: 'hide' }[this.props.eigeneZeile ?? 'Anfang'] ?? 'start';
const mode = this.state.revealed ? 'show' : setting;
const hint = (t) => {
  if (mode === 'show') return t;
  const w = t.split(' ');
  return w.length <= 3 ? t : w.slice(0, 3).join(' ') + ' …';
};
const lines = texts.map((t) => ({ text: hint(t), visible: mode !== 'hide', hidden: mode === 'hide' }));
const speaking = (this.props.phase ?? 'wartet') === 'spricht';
return {
  past, lines,
  canReveal: mode !== 'show',
  reveal: () => this.setState({ revealed: true }),
  waiting: !speaking, speaking,
  level: speaking ? '62%' : '6%',
};
}
}
</script>
</body>
</html>
