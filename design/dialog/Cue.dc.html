<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Durchlauf: Lied-Hinweis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1F5FAB;color:#FFFFFF;font-family:'DM Sans',system-ui,sans-serif;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden">

<div style="display:flex;align-items:center;gap:10px">
<a href="Main.dc.html" aria-label="Zurück zur Auswahl" style="width:44px;height:44px;border-radius:22px;background:#17498C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div style="flex:1;min-width:0">
<div style="font-family:'Fraunces',serif;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Szene 4 · [Szenentitel]</div>
<div role="img" aria-label="Fortschritt in der Szene: 27 von 61" style="height:3px;border-radius:2px;background:#3F78BF;margin-top:6px"><div style="width:44%;height:100%;border-radius:2px;background:#FFFFFF"></div></div>
</div>
<a href="Settings.dc.html" aria-label="Einstellungen" style="width:44px;height:44px;border-radius:22px;background:#17498C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</a>
</div>

<div role="status" style="display:flex;align-items:center;gap:10px;background:#0F2F57;border-radius:12px;padding:8px 12px;font-size:13px;flex:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
<span style="flex:1">Nichts gehört, nach 20 s weitergemacht.</span>
<a href="Turn.dc.html" style="font-weight:700;color:#FFD166;min-height:32px;display:flex;align-items:center">Nochmal</a>
</div>

<div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden">

<sc-for list="{{past}}" as="p" hint-placeholder-count="6">
<div style="opacity:{{p.fade}};padding:0 4px">
<div style="font-size:12px;font-weight:700;color:{{p.who}}">{{p.role}}</div>
<div style="font-size:16px;line-height:1.4;margin-top:1px">{{p.text}}</div>
</div>
</sc-for>

<div style="border:1px solid #3F78BF;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px">
<span style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#CFE0F5">Regie</span>
<span style="font-size:16px;font-style:italic;line-height:1.4">Der Chor stellt sich auf, Anna schaut zu.</span>
<div role="img" aria-label="läuft gleich weiter" style="height:3px;border-radius:2px;background:#3F78BF"><div style="width:70%;height:100%;border-radius:2px;background:#CFE0F5"></div></div>
</div>

<div style="background:#FFFFFF;color:#0F2F57;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px">
<span style="width:44px;height:44px;border-radius:22px;background:#1F5FAB;display:flex;align-items:center;justify-content:center;flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:12px;font-weight:700;color:#1F5FAB">Jetzt kommt ein Lied · Anna singt mit</span><span style="display:block;font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-top:2px">Lied 4 · [Liedtitel]</span></span>
</div>
<div style="display:flex;gap:8px">
<a href="Main.dc.html" style="flex:1;height:48px;border-radius:24px;background:#C8E05A;color:#0F2F57;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#0F2F57" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Lied üben</a>
<a href="Play.dc.html" style="flex:1;height:48px;border-radius:24px;border:2px solid #1F5FAB;color:#1F5FAB;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box">Weiter im Text</a>
</div>
</div>

</div>

<div style="display:flex;align-items:center;justify-content:space-between;flex:none">
<a href="Turn.dc.html" aria-label="Zurück zum vorigen Eintrag" style="width:52px;height:52px;border-radius:26px;background:#17498C;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v14L9 12z"/><path d="M5 5v14" stroke-linecap="round"/></svg>
</a>
<button aria-label="Pause" style="width:64px;height:64px;border-radius:32px;background:#C8E05A;border:0;display:flex;align-items:center;justify-content:center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#0F2F57" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
</button>
<button aria-label="Szene wiederholen ist aus" aria-pressed="false" style="width:52px;height:52px;border-radius:26px;background:#17498C;border:0;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 014-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 01-4 4H4"/></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const items = [
  ['Mutter', 'Na gut, aber nur eine kleine. Und dann gehen wir noch zum Glühweinstand.'],
  ['Anna', 'Kinderpunsch für mich!'],
  ['Benjamin', 'Hallo Anna! Kennst du schon Jo vom Krippenspiel? Der wohnt jetzt auch hier.'],
  ['Anna', 'Nein, aber das kannst du mir gleich erzählen.'],
  ['Erzähler 2', 'Und während sie noch überlegten, begann auf dem Platz die Musik.'],
];
const n = items.length;
const past = items.map(([role, text], i) => ({
  role: role === 'Anna' ? 'Anna · du' : role, text,
  who: role === 'Anna' ? '#C8E05A' : '#A9D3F7',
  fade: String(0.35 + 0.5 * (i + 1) / n),
}));
return { past };
}
}
</script>
</body>
</html>
