<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Start Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
input::placeholder{color:#5B6F8C}
</style>
</helmet>
<div style="min-height:800px;box-sizing:border-box;background:#1F5FAB;color:#FFFFFF;font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:48px 24px">
<div style="width:100%;max-width:1100px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:64px">

<div style="flex:1 1 440px;display:flex;flex-direction:column;gap:28px">
<div style="width:320px;max-width:100%;height:120px;border-radius:24px;background:#FFFFFF;border:2px dashed #A9D3F7;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#1F5FAB;font-size:14px;font-weight:700;text-align:center;line-height:1.4">[Logo LKG Radeland<br>hier einsetzen]</div>
<div>
<div style="font-size:14px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#C8E05A">Weihnachtsmusical 2026</div>
<h1 style="margin:10px 0 0;font-family:'Fraunces',serif;font-size:56px;font-weight:600;line-height:1.05">Gemeinsam üben</h1>
<p style="margin:16px 0 0;font-size:18px;line-height:1.5;color:#CFE0F5;max-width:460px">Lieder zum Mitsingen, mit und ohne Voicetrack, und Tonhöhen-Feedback in Echtzeit.</p>
</div>
</div>

<form style="flex:1 1 380px;max-width:440px;display:flex;flex-direction:column;gap:16px;background:#17498C;border-radius:28px;padding:32px">
<label for="pw" style="font-size:16px;font-weight:700">Passwort</label>
<div style="display:flex;align-items:center;height:60px;border-radius:16px;background:#FFFFFF;padding:0 8px 0 18px;gap:12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5FAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
<input id="pw" type="password" placeholder="Passwort eingeben" autocomplete="current-password" style="flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:17px;color:#0F2F57">
<button type="button" aria-label="Passwort anzeigen" style="width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5FAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
<a href="SongsDesktop.dc.html" style="height:60px;border-radius:30px;background:#C8E05A;color:#0F2F57;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">Entsperren</a>
<div style="display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;color:#CFE0F5;margin-top:4px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CFE0F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
<span>Alle Lieder und Stimmen sind verschlüsselt. Das Passwort wird nur auf diesem Gerät gespeichert, du musst es nur einmal eingeben.</span>
</div>
</form>

</div>
</div>
</x-dc>

</body>
</html>
