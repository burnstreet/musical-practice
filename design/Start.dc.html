<button type="button" aria-label="Passwort anzeigen" style="width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer">

<a href="Songs.dc.html" style="height:56px;border-radius:28px;background:#C8E05A;color:#0F2F57;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">Entsperren</a>

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CFE0F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
