<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Text: läuft in der Wiederholung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1F5FAB;color:#FFFFFF;font-family:'DM Sans',system-ui,sans-serif;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden">

<div style="display:flex;align-items:center;gap:10px;flex:none">
<a href="Main.dc.html" aria-label="Zurück zur Auswahl" style="width:44px;height:44px;border-radius:22px;background:#17498C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div style="flex:1;min-width:0">
<div style="font-family:'Fraunces',serif;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Szene 4 · [Szenentitel]</div>
<div role="img" aria-label="Fortschritt in der Szene" style="height:3px;border-radius:2px;background:#3F78BF;margin-top:6px"><div style="width:69%;height:100%;border-radius:2px;background:#FFFFFF"></div></div>
</div>
<a href="#" aria-label="Einstellungen" style="width:44px;height:44px;border-radius:22px;background:#17498C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</a>
</div>

<div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden">

<sc-for list="{{past}}" as="p" hint-placeholder-count="6">
<sc-if value="{{p.isDir}}" hint-placeholder-val="{{false}}">
<div style="font-size:14px;font-style:italic;line-height:1.4;color:#CFE0F5;padding:0 4px;opacity:{{p.fade}}">{{p.text}}</div>
</sc-if>
<sc-if value="{{p.isLine}}" hint-placeholder-val="{{true}}">
<div style="opacity:{{p.fade}};padding:0 4px">
<div style="font-size:12px;font-weight:700;color:{{p.who}}">{{p.role}}</div>
<div style="font-size:16px;line-height:1.4;margin-top:1px">{{p.text}}</div>
</div>
</sc-if>
</sc-for>

<div style="display:flex;align-items:center;gap:6px;padding:0 4px">
<span style="height:20px;padding:0 8px;border-radius:6px;background:{{accent}};color:#0F2F57;font-size:11px;font-weight:700;display:flex;align-items:center">Von</span>
</div>

<div style="background:#FFFFFF;color:#0F2F57;border-radius:18px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;border-left:6px solid {{accent}}">
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="height:26px;padding:0 12px;border-radius:13px;background:#1F5FAB;color:#FFFFFF;display:flex;align-items:center;font-size:13px;font-weight:700">Vater</span>
<svg width="44" height="18" viewBox="0 0 44 20" role="img" aria-label="Wiedergabe läuft"><g fill="#1F5FAB"><rect x="0" y="7" width="4" height="6" rx="2"/><rect x="8" y="3" width="4" height="14" rx="2"/><rect x="16" y="0" width="4" height="20" rx="2"/><rect x="24" y="5" width="4" height="10" rx="2"/><rect x="32" y="2" width="4" height="16" rx="2"/><rect x="40" y="7" width="4" height="6" rx="2"/></g></svg>
</div>
<div style="font-family:'Fraunces',serif;font-size:23px;font-weight:500;line-height:1.35">Sie wünscht sich doch jedes Jahr etwas, das klingelt.</div>
</div>

<div style="border:2px dashed {{accent}};border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
<span style="flex:1;font-size:13px;font-weight:700;color:{{accent}}">Gleich du · Lena, 1 Zeile · dann wieder von vorn</span>
</div>

</div>

<div style="display:flex;align-items:center;gap:8px;height:44px;border:2px solid {{accent}};border-radius:22px;padding:0 4px 0 14px;box-sizing:border-box;flex:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg>
<span style="flex:1;font-size:14px;font-weight:700;color:{{accent}}">Wiederholung · 2 Zeilen</span>
<button aria-label="Wiederholung aufheben" style="width:36px;height:36px;border-radius:18px;background:#17498C;border:0;display:flex;align-items:center;justify-content:center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;flex:none">
<button aria-label="Zurück zum vorigen Eintrag" style="width:52px;height:52px;border-radius:26px;background:#17498C;border:0;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v14L9 12z"/><path d="M5 5v14" stroke-linecap="round"/></svg>
</button>
<button aria-label="Rest von Vater überspringen" style="height:52px;padding:0 14px;border-radius:26px;background:#17498C;border:0;color:#FFFFFF;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 5v14l10-7z"/><path d="M19 5v14" stroke-linecap="round"/></svg>Überspringen
</button>
<a href="Range.dc.html" aria-label="Pause" style="width:64px;height:64px;border-radius:32px;background:{{accent}};display:flex;align-items:center;justify-content:center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#0F2F57" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
</a>
<button aria-label="Sprechtempo der anderen 1,0-fach" style="width:52px;height:52px;border-radius:26px;background:#17498C;border:0;color:#FFFFFF;font-size:13px;font-weight:700">1,0×</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8E05A","options":["#C8E05A","#8FD16A","#FFD166","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C8E05A';
const items = [
  ['Vater', 'Und dann bist du den ganzen Weg gerannt?'],
  ['Lena', 'Nur das letzte Stück.'],
  [null, 'Vater setzt sich auf die Bank.'],
  ['Vater', 'Macht nichts. Komm, wir kaufen noch schnell ein Geschenk für Tante Ilse.'],
];
const n = items.length;
const past = items.map(([role, text], i) => ({
  role: role === 'Lena' ? 'Lena · du' : role, text,
  isLine: !!role, isDir: !role,
  who: role === 'Lena' ? accent : '#A9D3F7',
  fade: String(0.3 + 0.4 * (i + 1) / n),
}));
return { accent, past };
}
}
</script>
</body>
</html>
