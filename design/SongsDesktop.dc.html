<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Rolle und Lied Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height:800px;box-sizing:border-box;background:#1F5FAB;color:#FFFFFF;font-family:'DM Sans',system-ui,sans-serif;padding:24px 40px 40px;display:flex;flex-direction:column;gap:32px">

<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:16px">
<div style="width:120px;height:48px;border-radius:12px;background:#FFFFFF;border:2px dashed #A9D3F7;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#1F5FAB;font-size:11px;font-weight:700;text-align:center;line-height:1.2">[Logo]</div>
<div><div style="font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#C8E05A">Weihnachtsmusical 2026</div><div style="font-family:'Fraunces',serif;font-size:22px;font-weight:600">Gemeinsam üben</div></div>
</div>
<div style="font-size:14px;color:#CFE0F5">10 Lieder · Passwort gespeichert</div>
</header>

<div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">

<aside style="flex:1 1 300px;max-width:360px;display:flex;flex-direction:column;gap:20px">
<div style="background:#17498C;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-family:'Fraunces',serif;font-size:26px;font-weight:600">Wer bist du im Stück?</h2>
<div style="font-size:14px;color:#CFE0F5">Du kannst mehrere Rollen wählen.</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="7">
<button aria-pressed="{{r.on}}" style="height:44px;padding:0 18px;border-radius:22px;border:2px solid {{r.border}};background:{{r.bg}};color:{{r.color}};font-size:15px;font-weight:{{r.weight}}">{{r.name}}</button>
</sc-for>
</div>
</div>

</aside>

<section style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px">
<h2 style="margin:0;font-family:'Fraunces',serif;font-size:26px;font-weight:600">Lied zum Üben</h2>
<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#CFE0F5"><span style="width:10px;height:10px;border-radius:5px;background:#C8E05A;display:inline-block"></span>deine Rolle singt mit</div>
</div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
<sc-for list="{{songs}}" as="s" hint-placeholder-count="10">
<a href="MainDesktop.dc.html" style="display:flex;align-items:center;gap:16px;background:#17498C;border-radius:18px;border:2px solid {{s.border}};padding:12px 16px;min-height:72px;box-sizing:border-box">
<span style="width:40px;height:40px;border-radius:20px;background:{{s.numBg}};color:{{s.numColor}};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none">{{s.num}}</span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:700">[Liedtitel eintragen]</span><span style="display:block;font-size:13px;color:#CFE0F5;margin-top:2px">{{s.roles}}</span></span>
<sc-if value="{{s.mine}}" hint-placeholder-val="{{ true }}"><span style="width:10px;height:10px;border-radius:5px;background:#C8E05A;flex:none"></span></sc-if>
</a>
</sc-for>
</div>
</section>

</div>

<div style="margin-top:auto;background:#17498C;border-radius:24px;border:2px solid #C8E05A;padding:20px 24px;display:flex;flex-wrap:wrap;align-items:stretch;gap:20px 24px">
<div style="flex:0 1 220px;display:flex;flex-direction:column;justify-content:center"><div style="font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#C8E05A">Ausgewählt</div><div style="font-size:20px;font-weight:700;margin-top:4px">Lied 3 · [Liedtitel eintragen]</div></div>
<div role="group" aria-label="Voicetrack" style="flex:1 1 560px;min-width:0;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:8px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
<button aria-pressed="{{m.on}}" style="display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:2px solid {{m.border}};background:#1F5FAB;color:#FFFFFF;box-sizing:border-box">
<span style="width:20px;height:20px;border-radius:10px;border:2px solid {{m.ring}};box-sizing:border-box;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:5px;background:{{m.dot}}"></span></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:700">{{m.title}}</span><span style="display:block;font-size:12px;line-height:1.4;color:#CFE0F5;margin-top:2px">{{m.desc}}</span></span>
</button>
</sc-for>
</div>
<a href="MainDesktop.dc.html" style="flex:0 0 180px;min-height:56px;border-radius:28px;background:#C8E05A;color:#0F2F57;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;align-self:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0F2F57" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Üben starten</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const mine = ['Maria', 'Chor'];
const names = ['Erzähler', 'Maria', 'Josef', 'Engel', 'Hirten', 'Könige', 'Chor'];
const roles = names.map((name) => {
const on = mine.includes(name);
return { name, on, border: on ? '#C8E05A' : '#A9D3F7', bg: on ? '#C8E05A' : 'transparent', color: on ? '#0F2F57' : '#FFFFFF', weight: on ? '700' : '500' };
});
const list = [
['Chor, Erzähler'], ['Maria, Josef'], ['Chor, Engel, Hirten'], ['Josef, Hirten'], ['Chor'],
['Könige, Erzähler'], ['Maria, Engel, Chor'], ['Hirten, Engel'], ['Maria, Josef, Erzähler'], ['Alle']
];
const songs = list.map(([r], i) => {
const selected = i === 2;
const isMine = mine.some((m) => r.includes(m)) || r === 'Alle';
return { num: String(i + 1), roles: r, mine: isMine, border: selected ? '#C8E05A' : 'transparent', numBg: selected ? '#C8E05A' : '#1F5FAB', numColor: selected ? '#0F2F57' : '#FFFFFF' };
});
const sel = 1;
const defs = [
['Mit Voicetrack', 'Alle Stimmen sind zu hören.'],
['Voicetrack nur für andere', 'Meine Rolle ist stumm, die anderen Stimmen sind zu hören.'],
['Auto', 'Meine Stimme wird nur eingespielt, wenn ich nicht mitsinge.'],
['Nur Playback', 'Nur die Begleitung, keine Stimmen.']
];
const modes = defs.map(([title, desc], i) => {
const on = i === sel;
return { title, desc, on, border: on ? '#C8E05A' : '#3F78BF', ring: on ? '#C8E05A' : '#A9D3F7', dot: on ? '#C8E05A' : 'transparent' };
});
return { roles, songs, modes };
}
}
</script>
</body>
</html>
